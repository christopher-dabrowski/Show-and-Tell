[project]
name            = "show-and-tell"
version         = "0.1.0"
description     = "Academic project for experimenting with Show and Tell image captioning model"
readme          = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy<2.0.0",
  "pillow>=10.0.0",
  "scikit-image>=0.20.0",
  "scipy>=1.10.0",
  "h5py",
  "nltk",
  "tqdm",
  "opencv-python",
  "matplotlib",
  "imageio",
  "torch",
  "torchvision",
  "ipykernel>=7.2.0",
  "notebook>=7.5.6",
  "pandas>=2.3.3",
  "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.2.2",
]

[tool.pylint.'MESSAGES CONTROL']
disable = "missing-docstring,invalid-name,line-too-long"
